name: Kura
options:
  bundleIdPrefix: io.communeo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Kura:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Kura
        excludes:
          - "Resources/AppIcon-1024.png"
          - "Info.plist"
    info:
      path: Kura/Info.plist
      properties:
        CFBundleDisplayName: Kura
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Newsreader-Regular.ttf
          - Newsreader-Medium.ttf
          - Newsreader-Italic.ttf
          - Newsreader-MediumItalic.ttf
          - HankenGrotesk-Regular.ttf
          - HankenGrotesk-Medium.ttf
          - HankenGrotesk-SemiBold.ttf
          - RedHatMono-Regular.ttf
          - RedHatMono-Medium.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.communeo.kura
        PRODUCT_NAME: Kura
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  Kura:
    build:
      targets:
        Kura: all
    run:
      config: Debug
