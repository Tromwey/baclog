name: Kura
options:
  bundleIdPrefix: com.tromwey
  # The app is Spanish-only: CFBundleDevelopmentRegion = es-MX so system UI (share sheet,
  # text-field menus, alerts) matches the copy and App Store Connect lists Spanish.
  developmentLanguage: es-MX
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Version the user sees (CFBundleShortVersionString). Bump by hand per App Store release.
    MARKETING_VERSION: "1.0.0"
    # Fallback only: scripts/archive.sh overrides it on the xcodebuild line with the commit
    # count (`git rev-list --count HEAD`), so every TestFlight upload gets a higher build number.
    CURRENT_PROJECT_VERSION: "1"
targets:
  Kura:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # Signing: DEVELOPMENT_TEAM = $(KURA_TEAM_ID) from Config/Kura.xcconfig, which optionally
    # includes the gitignored Config/Team.xcconfig. No team → unsigned simulator builds work as
    # before; scripts/archive.sh passes DEVELOPMENT_TEAM on the command line and fails without it.
    configFiles:
      Debug: Config/Kura.xcconfig
      Release: Config/Kura.xcconfig
    sources:
      - path: Kura
        excludes:
          - "Resources/AppIcon-1024.png"
          - "Resources/AppIcon.icon"
          - "Info.plist"
          - "Info-Debug.plist"
          - "Kura.entitlements"
          - "Kura-Debug.entitlements"
      # Ícono Liquid Glass por capas (Icon Composer), generado por scripts/build-app-icon.py.
      # Va como archivo (no como carpeta) para que actool lo compile; con el mismo nombre que
      # ASSETCATALOG_COMPILER_APPICON_NAME reemplaza al AppIcon.appiconset, y Xcode genera
      # desde él las versiones planas para iOS < 26.
      - path: Kura/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    info:
      path: Kura/Info.plist
      properties:
        CFBundleDisplayName: Kura
        LSRequiresIPhoneOS: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        # KURA_API_BASE, split in scheme/host so `//` never lands in a build setting.
        # Debug: http://localhost:3010/api/v1 · Release: https://baclog.app/api/v1 (see configs below).
        KuraAPIBase: $(KURA_API_SCHEME)://$(KURA_API_HOST)/api/v1
        UIAppFonts:
          - Newsreader-Regular.ttf
          - Newsreader-Medium.ttf
          - Newsreader-Italic.ttf
          - Newsreader-MediumItalic.ttf
          - HankenGrotesk-Regular.ttf
          - HankenGrotesk-Medium.ttf
          - HankenGrotesk-SemiBold.ttf
          - RedHatMono-Regular.ttf
          - RedHatMono-Medium.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tromwey.kura
        PRODUCT_NAME: Kura
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        # Automatic signing: archive signs with Apple Development, the export (ExportOptions.plist,
        # method app-store-connect) re-signs with Apple Distribution. Do NOT pin CODE_SIGN_IDENTITY /
        # PROVISIONING_PROFILE_SPECIFIER here: with Automatic they conflict and the archive fails.
        # Entitlements: Sign in with Apple + Push (aps-environment). One file per configuration
        # because the APNs gateway differs: Debug = development (sandbox tokens), Release =
        # production (TestFlight / App Store). Both capabilities must be on in the App ID
        # com.tromwey.kura; automatic signing with -allowProvisioningUpdates usually turns them on.
        # No keychain sharing, no associated domains.
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Kura/Kura-Debug.entitlements
          KURA_API_SCHEME: http
          KURA_API_HOST: "localhost:3010"
          # Debug-only plist: same keys + NSAllowsLocalNetworking for the dev server on the Mac.
          INFOPLIST_FILE: Kura/Info-Debug.plist
        Release:
          CODE_SIGN_ENTITLEMENTS: Kura/Kura.entitlements
          KURA_API_SCHEME: https
          KURA_API_HOST: baclog.app
schemes:
  Kura:
    build:
      targets:
        Kura: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
