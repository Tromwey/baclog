# Gradle daemon / Kotlin daemon
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# AndroidX only, no Jetifier (every dependency is AndroidX already)
android.useAndroidX=true
android.enableJetifier=false
# R class per module (smaller, faster builds)
android.nonTransitiveRClass=true

# Optional per-invocation properties (pass with -P, never set here):
#   kuraApiHost=host:port   debug API host (default 10.0.2.2:3010, the Mac seen from the emulator)
#   kuraBuildDir=/abs/path   parallel lanes: build output outside the checkout
#   kuraAppIdSuffix=.lane    parallel lanes: debug applicationId/versionName suffix
