# Kura Android — version catalog. Every dependency the app will use is declared here, even the
# ones the scaffold doesn't use yet (design system, API client, sign-in lanes build on it).
#
# Compatibility envelope (why these and not newer), verified 2026-09-30 — the Material 3
# Expressive lane (android/BRIEF.md › "Envolvente de compilación"):
#   • Gradle 9.8.0 → AGP 9.4.1 (latest stable; AGP 9.x needs Gradle ≥ 9.1 and JDK ≥ 17 to RUN
#     Gradle). AGP 9 brings Kotlin built in: there is NO `org.jetbrains.kotlin.android` plugin any
#     more (applying it fails). The compose + serialization compiler plugins stay.
#   • compileSdk 37 (AGP 9.4 knows it; `platforms;android-37.0`), targetSdk stays 36 on purpose
#     (targeting 37 is a behavior change, its own lane). Why 37: material3 1.5.0-alpha27,
#     core 1.19, Ktor 3.6 (→ okhttp-android 5.5.0) and Coil 3.5 ship aar-metadata
#     minCompileSdk=37 + minAGP=9.1 (learnings/2026-09-29-android-compilesdk-37-transitivo.md).
#   • material3 1.5.0-alpha27, PINNED EXPLICITLY (outside the BOM): the BOM 2026.09.00 brings
#     material3 1.4.0, which only has the Expressive theme/MotionScheme — not ButtonGroup,
#     ToggleButton, SplitButton, FloatingToolbar, LoadingIndicator, FloatingActionButtonMenu,
#     ShortNavigationBar, Large/MediumFlexibleTopAppBar, expressive ListItem (checked in the AAR).
#     alpha27 and not alpha28/29: from alpha28 material3 declares Compose foundation/ui/runtime
#     1.13.0-alpha01, which would drag ALL of Compose onto an alpha; alpha27 declares
#     1.12.0-beta01, so the BOM's stable 1.12.1 wins with no `strictly`. alpha29 only adds
#     ComponentStylesKt (the styles API) — nothing the chrome needs. Founder, 2026-09-30:
#     "prefiero Compose estable". Don't move off alpha27 without its own lane (and never force
#     Compose down with `strictly`: material3 is compiled against its declared Compose).
#   • Compose BOM 2026.09.00 (ui/foundation 1.12.1): 1.12 needs compileSdk 37 + AGP ≥ 9.1.
#   • Kotlin 2.3.21 — put on the build classpath through `buildscript` in the root build file
#     (AGP 9.4 only has a runtime dependency on KGP 2.2.10, which Gradle upgrades to ours). Ktor
#     3.6 and kotlinx-serialization 1.11 are built with 2.3.21 (the serialization runtime refuses
#     an older compiler plugin). Coil 3.5+ pulls kotlin-stdlib 2.4.x: a 2.3 compiler reads 2.4
#     metadata (Kotlin's one-version-ahead rule), so no bump needed; move Kotlin to 2.4 in a lane
#     of its own if a library ever needs 2.5 metadata.
#   • Ktor 3.6.0 (okhttp 5.5.0), Coil 3.5.0, core-ktx 1.19.1, lifecycle 2.11.0, navigation
#     2.10.2, activity 1.13.0: latest stable on 2026-09-30; none has a tope below that.
#   • Fase 2 (2026-09-30, aar-metadata checked): androidx.browser 1.10.0 (Custom Tabs for TIDAL's
#     OAuth; minCompileSdk 36 / minAGP 8.9.1), work-runtime-ktx 2.12.0 (local release reminders;
#     minCompileSdk 35 / minAGP 8.6), Firebase BOM 34.19.0 → firebase-messaging 25.1.3 (FCM;
#     minCompileSdk 1). All latest stable, all inside 37 / 9.4. NO `com.google.gms.google-services`
#     plugin: the app builds `FirebaseOptions` by hand from app/google-services.json's values and
#     calls `FirebaseApp.initializeApp` itself (one less plugin to keep in step with AGP 9).
#   Re-check all of this (aar-metadata minCompileSdk/minAGP) before bumping anything.

[versions]
agp = "9.4.1"
kotlin = "2.3.21"
coreKtx = "1.19.1"
coreSplashscreen = "1.2.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.10.2"
composeBom = "2026.09.00"
# Outside the BOM on purpose (see the envelope above): the Expressive components.
material3 = "1.5.0-alpha27"
coil = "3.5.0"
ktor = "3.6.0"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"
palette = "1.0.0"
credentials = "1.6.0"
googleid = "1.2.1"
junit = "4.13.2"
datastore = "1.2.1"
browser = "1.10.0"
work = "2.12.0"
firebaseBom = "34.19.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-palette-ktx = { group = "androidx.palette", name = "palette-ktx", version.ref = "palette" }
# Fase 2: Custom Tabs (TIDAL OAuth) · WorkManager (avisos locales de estreno)
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# Firebase (versions from the BOM). FCM only; FirebaseApp is initialized by hand (no gms plugin).
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }

# Compose (versions from the BOM)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-text = { group = "androidx.compose.ui", name = "ui-text" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
# Material 3 Expressive = the chrome (android/BRIEF.md): themed with Kura tokens via
# MaterialExpressiveTheme, always behind a Kura wrapper in designsystem/components/. Explicit
# version: an explicit version beats the BOM's recommendation (1.4.0) in conflict resolution.
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }

# Images
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# API client
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

# Sign in (Credential Manager + Google ID)
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

# Build classpath (root `buildscript`): AGP 9's built-in Kotlin runs on this KGP, not its bundled 2.2.10.
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

# Tests (JVM)
junit = { group = "junit", name = "junit", version.ref = "junit" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
# The store's tests (`runTest`, virtual time for the Deshacer window): same version as the runtime.
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

[bundles]
compose = ["androidx-compose-ui", "androidx-compose-ui-graphics", "androidx-compose-ui-text", "androidx-compose-foundation", "androidx-compose-animation", "androidx-compose-ui-tooling-preview"]
ktor = ["ktor-client-core", "ktor-client-okhttp", "ktor-client-content-negotiation", "ktor-serialization-kotlinx-json"]
coil = ["coil-compose", "coil-network-okhttp"]
credentials = ["androidx-credentials", "androidx-credentials-play-services-auth", "googleid"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
