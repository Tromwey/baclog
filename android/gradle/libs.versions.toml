# Kura Android — version catalog. Every dependency the app will use is declared here, even the
# ones the scaffold doesn't use yet (design system, API client, sign-in lanes build on it).
#
# Compatibility envelope (why these and not newer), verified 2026-09-29:
#   • Gradle 8.14.3 caps AGP at 8.13.x (AGP 9 needs Gradle 9).
#   • AGP 8.13 caps compileSdk at 36 in practice, and several 2026 AndroidX releases ship
#     aar-metadata minCompileSdk=37 + minAGP=9.1 (core 1.19, compose-ui 1.12 → BOM ≥ 2026.08).
#     So: core 1.18.0, Compose BOM 2026.06.01 (ui 1.11.4, minCompileSdk 35).
#   • Ktor 3.5.2, not 3.6: Ktor 3.6 pulls OkHttp 5.5.0, whose okhttp-android AAR demands
#     compileSdk 37 (checkDebugAarMetadata fails). 3.5.2 brings OkHttp 5.3.2 (no minCompileSdk).
#   • Kotlin 2.3.21: Ktor 3.5 and kotlinx-serialization 1.11 are built on Kotlin 2.3.2x (the
#     serialization runtime refuses an older compiler plugin); a 2.2 compiler would pin Ktor 3.3.
#     Coil stays on 3.4.0 because Coil ≥ 3.5 pulls kotlin-stdlib 2.4.x.
#   Re-check all of this the day the project moves to Gradle 9 / AGP 9 / compileSdk 37.

[versions]
agp = "8.13.2"
kotlin = "2.3.21"
coreKtx = "1.18.0"
coreSplashscreen = "1.2.0"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
navigationCompose = "2.9.8"
composeBom = "2026.06.01"
coil = "3.4.0"
ktor = "3.5.2"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"
palette = "1.0.0"
credentials = "1.6.0"
googleid = "1.2.1"
junit = "4.13.2"
datastore = "1.2.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-palette-ktx = { group = "androidx.palette", name = "palette-ktx", version.ref = "palette" }

# Compose (versions from the BOM)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-text = { group = "androidx.compose.ui", name = "ui-text" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
# Base for ModalBottomSheet & co. only — the root theme is Kura's own, never MaterialTheme's look.
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Images
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# API client
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

# Sign in (Credential Manager + Google ID)
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

# Tests (JVM)
junit = { group = "junit", name = "junit", version.ref = "junit" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
# The store's tests (`runTest`, virtual time for the Deshacer window): same version as the runtime.
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

[bundles]
compose = ["androidx-compose-ui", "androidx-compose-ui-graphics", "androidx-compose-ui-text", "androidx-compose-foundation", "androidx-compose-animation", "androidx-compose-ui-tooling-preview"]
ktor = ["ktor-client-core", "ktor-client-okhttp", "ktor-client-content-negotiation", "ktor-serialization-kotlinx-json"]
coil = ["coil-compose", "coil-network-okhttp"]
credentials = ["androidx-credentials", "androidx-credentials-play-services-auth", "googleid"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
